name: Build all MBC AABs

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/**
    paths:
      - '.github/workflows/build-all-aabs.yml'
      - 'scripts/play/**'
      - 'download/android/**'
      - 'Navigate/**'
      - 'apk-catalog.json'

jobs:
  build-aabs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm install

      - name: Restore keystores
        env:
          MBC_KEYSTORE_B64: ${{ secrets.MBC_UPLOAD_KEYSTORE_BASE64 }}
          NAV_KEYSTORE_B64: ${{ secrets.NAVIGATE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p secrets Navigate/android
          if [ -n "$MBC_KEYSTORE_B64" ]; then
            echo "$MBC_KEYSTORE_B64" | base64 -d > secrets/mbc-upload.keystore
          fi
          if [ -n "$NAV_KEYSTORE_B64" ]; then
            echo "$NAV_KEYSTORE_B64" | base64 -d > Navigate/android/navigate-release.keystore
          fi

      - name: Sync play app catalog
        run: node scripts/play/sync-play-apps.mjs

      - name: Build local AABs (MBC Store + Navigate)
        env:
          MBC_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MBC_UPLOAD_KEYSTORE_PASSWORD }}
          MBC_UPLOAD_KEY_PASSWORD: ${{ secrets.MBC_UPLOAD_KEY_PASSWORD }}
          NAVIGATE_KEYSTORE_PASSWORD: ${{ secrets.NAVIGATE_KEYSTORE_PASSWORD }}
          NAVIGATE_KEY_PASSWORD: ${{ secrets.NAVIGATE_KEY_PASSWORD }}
        run: |
          npm run play:build -- mbc-store
          npm run play:build -- navigate

      - name: Build cloned AABs (optional — needs GH_PAT)
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MBC_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MBC_UPLOAD_KEYSTORE_PASSWORD }}
          MBC_UPLOAD_KEY_PASSWORD: ${{ secrets.MBC_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT not set — skipping private-repo clone builds."
            exit 0
          fi
          export GITHUB_TOKEN="$GH_PAT"
          node scripts/play/ci-matrix.mjs >/dev/null
          CLONED=$(node -e "
            const c = require('./scripts/play/play-apps.json');
            console.log(c.apps.filter(a => a.build?.clone).map(a => a.slug).join(' '));
          ")
          for slug in $CLONED; do
            echo "Building clone app: $slug"
            npm run play:build -- "$slug" || echo "Optional build failed: $slug"
          done

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mbc-aabs
          path: aabs/**/*.aab
          if-no-files-found: warn

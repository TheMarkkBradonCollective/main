name: Build all MBC AABs

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/**
    paths:
      - 'scripts/play/**'
      - 'download/android/**'
      - 'Navigate/**'
      - 'apk-catalog.json'

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      local: ${{ steps.matrix.outputs.local }}
      cloned: ${{ steps.matrix.outputs.cloned }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install

      - name: Compute build matrix from APK catalog
        id: matrix
        run: node scripts/play/ci-matrix.mjs

  build-local-aabs:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.prepare-matrix.outputs.local) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm install

      - name: Skip empty matrix slot
        if: matrix.app == '__skip__'
        run: echo "No local AAB apps in catalog — skipping."

      - name: Restore keystores
        if: matrix.app != '__skip__'
        env:
          MBC_KEYSTORE_B64: ${{ secrets.MBC_UPLOAD_KEYSTORE_BASE64 }}
          NAV_KEYSTORE_B64: ${{ secrets.NAVIGATE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p secrets Navigate/android
          if [ -n "$MBC_KEYSTORE_B64" ]; then
            echo "$MBC_KEYSTORE_B64" | base64 -d > secrets/mbc-upload.keystore
          fi
          if [ -n "$NAV_KEYSTORE_B64" ]; then
            echo "$NAV_KEYSTORE_B64" | base64 -d > Navigate/android/navigate-release.keystore
          fi

      - name: Sync play app catalog
        if: matrix.app != '__skip__'
        run: node scripts/play/sync-play-apps.mjs

      - name: Build AAB
        if: matrix.app != '__skip__'
        env:
          MBC_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MBC_UPLOAD_KEYSTORE_PASSWORD }}
          MBC_UPLOAD_KEY_PASSWORD: ${{ secrets.MBC_UPLOAD_KEY_PASSWORD }}
          NAVIGATE_KEYSTORE_PASSWORD: ${{ secrets.NAVIGATE_KEYSTORE_PASSWORD }}
          NAVIGATE_KEY_PASSWORD: ${{ secrets.NAVIGATE_KEY_PASSWORD }}
        run: npm run play:build -- ${{ matrix.app }}

      - name: Upload AAB artifact
        if: matrix.app != '__skip__'
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.app }}
          path: aabs/${{ matrix.app }}/*.aab
          if-no-files-found: error

  build-cloned-aabs:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.prepare-matrix.outputs.cloned) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm install

      - name: Skip empty matrix slot
        if: matrix.app == '__skip__'
        run: echo "No clone-build apps in catalog — skipping."

      - name: Restore upload keystore
        if: matrix.app != '__skip__'
        env:
          MBC_KEYSTORE_B64: ${{ secrets.MBC_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p secrets
          if [ -n "$MBC_KEYSTORE_B64" ]; then
            echo "$MBC_KEYSTORE_B64" | base64 -d > secrets/mbc-upload.keystore
          fi

      - name: Sync play app catalog
        if: matrix.app != '__skip__'
        run: node scripts/play/sync-play-apps.mjs

      - name: Build AAB from private repo
        if: matrix.app != '__skip__'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          MBC_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MBC_UPLOAD_KEYSTORE_PASSWORD }}
          MBC_UPLOAD_KEY_PASSWORD: ${{ secrets.MBC_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT secret not configured — skipping private repo clone for ${{ matrix.app }}."
            mkdir -p "aabs/${{ matrix.app }}"
            exit 0
          fi
          export GITHUB_TOKEN="$GH_PAT"
          npm run play:build -- ${{ matrix.app }}

      - name: Upload AAB artifact
        if: matrix.app != '__skip__'
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.app }}
          path: aabs/${{ matrix.app }}/*.aab
          if-no-files-found: warn

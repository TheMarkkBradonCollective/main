name: Build all MBC AABs

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/**
    paths:
      - 'scripts/play/**'
      - 'download/android/**'
      - 'Navigate/**'
      - 'apk-catalog.json'

jobs:
  build-local-aabs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [mbc-store, navigate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Restore keystores
        env:
          MBC_KEYSTORE_B64: ${{ secrets.MBC_UPLOAD_KEYSTORE_BASE64 }}
          NAV_KEYSTORE_B64: ${{ secrets.NAVIGATE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p secrets Navigate/android
          if [ -n "$MBC_KEYSTORE_B64" ]; then
            echo "$MBC_KEYSTORE_B64" | base64 -d > secrets/mbc-upload.keystore
          fi
          if [ -n "$NAV_KEYSTORE_B64" ]; then
            echo "$NAV_KEYSTORE_B64" | base64 -d > Navigate/android/navigate-release.keystore
          fi

      - name: Sync play app catalog
        run: node scripts/play/sync-play-apps.mjs

      - name: Build AAB
        env:
          MBC_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MBC_UPLOAD_KEYSTORE_PASSWORD }}
          MBC_UPLOAD_KEY_PASSWORD: ${{ secrets.MBC_UPLOAD_KEY_PASSWORD }}
          NAVIGATE_KEYSTORE_PASSWORD: ${{ secrets.NAVIGATE_KEYSTORE_PASSWORD }}
          NAVIGATE_KEY_PASSWORD: ${{ secrets.NAVIGATE_KEY_PASSWORD }}
        run: npm run play:build -- ${{ matrix.app }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.app }}
          path: aabs/${{ matrix.app }}/*.aab
          if-no-files-found: error

  build-cloned-aabs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - buynothing
          - strainverse
          - spiritsverse
          - cookverse
          - friendr
          - findr
          - chatr
          - sss
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root dependencies
        run: npm ci

      - name: Restore upload keystore
        env:
          MBC_KEYSTORE_B64: ${{ secrets.MBC_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p secrets
          if [ -n "$MBC_KEYSTORE_B64" ]; then
            echo "$MBC_KEYSTORE_B64" | base64 -d > secrets/mbc-upload.keystore
          fi

      - name: Sync play app catalog
        run: node scripts/play/sync-play-apps.mjs

      - name: Build AAB from private repo
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          MBC_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MBC_UPLOAD_KEYSTORE_PASSWORD }}
          MBC_UPLOAD_KEY_PASSWORD: ${{ secrets.MBC_UPLOAD_KEY_PASSWORD }}
        run: npm run play:build -- ${{ matrix.app }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.app }}
          path: aabs/${{ matrix.app }}/*.aab
          if-no-files-found: warn

name: Make catalog repos public

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Flip catalog repos to public
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: node scripts/make-repos-public.mjs

      - name: Commit updated catalog flags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add My-Projects.json
          if git diff --staged --quiet; then
            echo "My-Projects.json already up to date."
          else
            git commit -m "Sync githubPrivate flags after making repos public"
            git push
          fi

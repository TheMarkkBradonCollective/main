name: Navigate Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build release zip
        run: npm run release:zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          APK="public/navigate.apk"
          ZIP="release/Navigate-v${VERSION}-release.zip"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            --title "Navigate v${VERSION}" \
            --notes "Custom GPS + Android Auto. Install via [MBC App Store](https://themarkkbradoncollective.github.io/main/download/) or APK below." \
            "$APK#Navigate-v${VERSION}.apk" \
            "$ZIP"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Upcoming shows and community nights at The Rink Studios Sacramento.">
<title>Upcoming Shows | The Rink Studios Sacramento</title>
<link rel="icon" href="../images/mark.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="events" data-root="../">
<main id="main">
  <header class="page-hero">
    <div class="page-hero-media"></div>
    <div class="page-hero-copy">
      <p class="kicker">Calendar</p>
      <h1>Upcoming shows</h1>
      <p class="lede">Music, fashion, and neighborhood nights. Filter the board, then open a date for doors, age policy, and tickets.</p>
    </div>
  </header>
  <section class="section">
    <div class="filter-row" role="group" aria-label="Filter shows">
      <button type="button" class="active" data-filter="all">All</button>
      <button type="button" data-filter="music">Music</button>
      <button type="button" data-filter="fashion">Fashion</button>
      <button type="button" data-filter="community">Community</button>
    </div>
    <div class="ticket-grid" id="event-grid"></div>
    <p class="empty-state" id="event-empty" hidden>Nothing in that lane right now. Try All.</p>
  </section>
</main>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
</body>
</html>

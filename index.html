<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="MBC Store — install and explore Markk Brandon Collective Android apps. Featured apps, categories, and one-tap APK downloads.">
<meta name="theme-color" content="#01875f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MBC Store">
<meta name="mobile-web-app-capable" content="yes">
<title>MBC Store</title>
<link rel="stylesheet" href="css/app-store.css?v=2.0.0">
<base href="./">
</head>
<body class="store-body">
<a class="store-skip" href="#store-main">Skip to content</a>

<header class="store-header" id="store-header">
  <button type="button" class="store-header-back" id="store-back" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="store-brand">
    <img src="icons/icon-192.png" width="32" height="32" alt="">
    <span class="store-brand-text" id="store-header-title">MBC Store</span>
  </div>
  <div class="store-search-wrap">
    <input class="store-search" id="store-search" type="search" placeholder="Search apps" autocomplete="off" aria-label="Search apps">
  </div>
</header>

<main class="store-main" id="store-main">
  <p class="store-loading">Loading apps…</p>
</main>

<nav class="store-bottom-nav" id="store-bottom-nav" aria-label="Store navigation">
  <button type="button" class="store-tab-btn active" data-tab="home" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>
    Home
  </button>
  <button type="button" class="store-tab-btn" data-tab="apps">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
    Apps
  </button>
  <button type="button" class="store-tab-btn" data-tab="categories">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
    Categories
  </button>
  <button type="button" class="store-tab-btn" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    Settings
  </button>
</nav>

<script src="js/pwa.js?v=2.0.0"></script>
<script src="js/app-store.js?v=2.0.0"></script>
</body>
</html>

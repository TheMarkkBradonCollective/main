# Copy to .github/workflows/build-aab.yml in each MBC app repo.
# Builds a signed AAB on tag push (v*) or manual dispatch.
name: Build AAB — {{APP_NAME}}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.MBC_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p secrets
          echo "$KEYSTORE_B64" | base64 -d > secrets/mbc-upload.keystore
          echo "ANDROID_KEYSTORE_PATH=$PWD/secrets/mbc-upload.keystore" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build signed AAB
        env:
          MBC_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MBC_UPLOAD_KEYSTORE_PASSWORD }}
          MBC_UPLOAD_KEY_PASSWORD: ${{ secrets.MBC_UPLOAD_KEY_PASSWORD }}
        run: npm run build:aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: {{SLUG}}-aab
          path: release/*.aab
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          AAB=$(ls release/*.aab | head -1)
          gh release upload "$TAG" "$AAB" --clobber || \
            gh release create "$TAG" "$AAB" \
              --title "{{APP_NAME}} v${VERSION}" \
              --notes "Signed AAB for Google Play. Package: {{PACKAGE_ID}}"
